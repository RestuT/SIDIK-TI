; SIDIK-TI PHP Runtime Configuration
; File ini dibaca oleh PHP di semua subdirektori /api/
; Berlaku untuk Vercel (vercel-php runtime) dan XAMPP lokal.

; ============================================================
; OUTPUT BUFFERING - Solusi definitif untuk 'headers already sent'
; ============================================================
; Aktifkan output buffering di level PHP runtime.
; Ini memastikan ob_start() berjalan SEBELUM byte apapun terkirim ke browser,
; bahkan sebelum <?php tag pertama dieksekusi — termasuk BOM tersembunyi.
output_buffering = On

; Jalankan bootstrap.php sebelum SETIAP file PHP dieksekusi.
; Ini adalah safety net kedua selain output_buffering = On.
auto_prepend_file = /var/task/user/api/bootstrap.php

; ============================================================
; SESSION
; ============================================================
session.use_strict_mode = 1
session.cookie_httponly  = 1
session.cookie_samesite  = Lax

; ============================================================
; ERROR HANDLING (Production)
; ============================================================
; Sembunyikan error dari output di production (log saja)
display_errors = Off
log_errors     = On
